<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6fc3f2">
<title>Max's World · 歡迎來到 Max 的小世界</title>
<meta name="description" content="Walk around Max's little 3D world — his drawings, numbers, LEGO engineering, sports and more. 走進 Max 的 3D 小世界。">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zhiyihan.com/">
<meta property="og:site_name" content="Max's World">
<meta property="og:title" content="Max's World · 歡迎來到 Max 的小世界">
<meta property="og:description" content="Walk around Max's little 3D world — his drawings, numbers, LEGO engineering, sports and more. 走進 Max 的 3D 小世界！">
<meta property="og:image" content="https://zhiyihan.com/assets/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%234f7fe0'/><text x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
</head>
<body>
<div id="scene"></div>

<!-- HUD -->
<div id="logo" class="hud" role="button" style="cursor:pointer"><div class="m">M</div><b>Max's World</b></div>
<div id="dirwrap"><div id="dir"><h3 id="dirtitle"></h3><div id="dirlist"></div></div></div>
<div id="topbtns" class="hud">
  <button id="sndbtn" class="roundbtn">🔊</button>
  <button id="langbtn" class="roundbtn">中文</button>
  <button id="helpbtn" class="roundbtn">?</button>
</div>
<div id="stars" class="hud"></div>
<div id="hint" class="hud"><span class="key">E</span><span id="hinttext"></span></div>
<div id="toast" class="hud"></div>
<div id="urltag" class="hud">zhiyihan.com</div>
<button id="tourhud"></button>
<div id="bigmsg"></div>

<!-- mobile controls -->
<div id="joy"><div id="joybase"></div><div id="joyknob"></div></div>
<div id="dpad">
  <button class="dbtn" data-k="ArrowUp"    style="grid-area:1/2" aria-label="up">▲</button>
  <button class="dbtn" data-k="ArrowLeft"  style="grid-area:2/1" aria-label="left">◀</button>
  <button class="dbtn" data-k="ArrowRight" style="grid-area:2/3" aria-label="right">▶</button>
  <button class="dbtn" data-k="ArrowDown"  style="grid-area:3/2" aria-label="down">▼</button>
</div>
<div id="mbtns">
  <button id="actbtn" class="bigbtn">⭐</button>
  <button id="jumpbtn" class="bigbtn">⬆️</button>
</div>

<!-- info panel -->
<div id="panelwrap">
  <div id="panel"><div id="panelrel">
    <button id="panelclose">✕</button>
    <div class="icon" id="panelicon"></div>
    <h2 id="paneltitle"></h2>
    <div class="sub" id="panelsub"></div>
    <p id="panelbody"></p>
    <div class="chips" id="panelchips"></div>
    <div id="panelgal"></div>
    <button id="tournext"></button>
  </div></div>
</div>

<!-- lightbox -->
<div id="lightbox"><img id="lbimg" alt=""><div class="cap" id="lbcap"></div></div>

<!-- intro -->
<div id="overlay">
  <div id="ocard">
    <div class="mlogo">M</div>
    <div id="olang"><button data-l="en" class="on">English</button><button data-l="zh">繁體中文</button></div>
    <h1 id="otitle">Max's World</h1>
    <div class="tag" id="otag"></div>
    <div class="ctr" id="octr"></div>
    <button id="startbtn"></button>
    <div class="url">ZHIYIHAN.COM</div>
  </div>
</div>

<div id="fallback"><div>This page needs WebGL to show Max's 3D world.<br>此頁面需要 WebGL 才能顯示 Max 的 3D 世界。<br><br>zhiyihan.com</div></div>

<script type="module" src="js/game.js"></script>
</body>
</html>
