<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a6b">
<title>滿滿英雄基地 · Max's Hero Base</title>
<meta name="description" content="Max's favourite superheroes — meet the Ultra family from the Land of Light, with story cards read aloud. 滿滿最喜歡的超級英雄：光之國奧特曼家族，每張卡都可以聽朗讀。">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zhiyihan.com/heroes.html">
<meta property="og:site_name" content="Max's World">
<meta property="og:title" content="滿滿英雄基地 · Max's Hero Base">
<meta property="og:description" content="Meet the Ultra family from the Land of Light. 認識光之國的奧特曼家族。">
<meta property="og:image" content="https://zhiyihan.com/assets/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%234f7fe0'/><text x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="heroes.css?v=0c90647d">
</head>
<body>
<header id="top">
  <a class="pill" href="./?from=heroes">← <span>Max's World</span></a>
  <h1 id="ttl"></h1>
  <div class="tools">
    <button id="sndbtn" class="rbtn" aria-label="Sound">🔊</button>
    <button id="langbtn" class="rbtn">EN</button>
  </div>
</header>

<main id="base">
  <p class="intro" id="intro"></p>

  <section class="series">
    <div class="shead">
      <h2 id="stitle"></h2>
      <button id="prog" class="prog"></button>
    </div>
    <p class="ssub" id="ssub"></p>
    <div class="catalog-tools">
      <label class="search-label" for="hero-search" id="search-label"></label>
      <input id="hero-search" type="search" autocomplete="off" aria-describedby="result-count">
      <div class="categories" id="categories" role="group"></div>
      <p id="result-count" class="result-count" role="status" aria-live="polite"></p>
    </div>
    <div class="grid" id="grid"></div>
    <p id="empty-results" hidden></p>
  </section>

  <section class="tree">
    <h2 id="treetitle"></h2>
    <div id="treebox"></div>
  </section>

  <p class="soon" id="soon"></p>
</main>

<div id="card" hidden>
  <div id="cbar">
    <button id="cclose" class="rbtn" aria-label="Close">✕</button>
    <div id="cname"></div>
    <button id="cspeak" class="rbtn" aria-label="Read aloud">🔊</button>
  </div>
  <div id="cscroll">
    <div id="cstage"><div id="cfig"></div></div>
    <div id="cacts">
      <button id="cmove" class="act"></button>
      <button id="cagain" class="act alt"></button>
    </div>
    <div id="cinfo"></div>
  </div>
  <div id="cnav">
    <button id="cprev" class="nbtn" aria-label="Previous">◀</button>
    <div id="cpage"></div>
    <button id="cnext" class="nbtn" aria-label="Next">▶</button>
  </div>
</div>

<div id="cert" hidden>
  <div class="paper">
    <div class="medal">🏅</div>
    <h3 id="certt"></h3>
    <p id="certb"></p>
    <div class="crew" id="certcrew"></div>
    <div class="sig" id="certsig"></div>
    <button id="certok" class="act"></button>
  </div>
</div>

<script type="module" src="js/heroes/heroes.js?v=0c90647d"></script>
</body>
</html>
